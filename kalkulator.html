<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Budget Umroh | UmraMandiri</title><meta name="theme-color" content="#7A1738">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body>
<nav><div class="w"><b><img src="assets/logo-mark-burgundy.png" alt="" onerror="this.remove()">Umra<i>Mandiri</i></b><a href="index.html">Beranda</a><a class="btn" data-wa="saya ingin konsultasi umroh mandiri" href="https://wa.me/6289624493600">Tanya via WhatsApp</a></div></nav>
<section><div class="w"><h1 style="font-size:clamp(1.9rem,5vw,3rem)">Kalkulator Budget Umroh</h1><p class="lead">Estimasi awal untuk menyiapkan anggaran. Bukan penawaran harga; angka final mengikuti tanggal, ketersediaan, kurs, dan kebijakan di Saudi.</p>
<form class="f" id="k" oninput="hitung()">
<label>Dewasa<input type="number" id="dw" min="1" value="2"></label><label>Infant<input type="number" id="inf" min="0" value="0"></label>
<label>Malam di Makkah<input type="number" id="mk" min="0" value="5"></label><label>Malam di Madinah<input type="number" id="md" min="0" value="4"></label>
<label>Kelas hotel<select id="tier"><option value="0">Ekonomis</option><option value="1" selected>Standar</option><option value="2">Nyaman</option></select></label>
<label>Transportasi lokal<select id="tr"><option value="1">Termasuk</option><option value="0">Tidak</option></select></label>
<label>Pendamping muthawwif<select id="mt"><option value="0">Tidak</option><option value="1">Ya</option></select></label></form>
<div class="res"><div class="sc"><table id="rinci"></table></div><p style="margin-top:14px">Total estimasi</p><div class="tot" id="tot"></div><p id="pp" style="color:var(--mut)"></p><p style="margin-top:14px"><a class="btn" id="bwa" href="#">Bahas hasil hitungan saya via WhatsApp</a></p></div></div></section>
<script src="assets/app.js"></script>
<script>
/* GANTI ANGKA DI BAWAH dengan tarif terbaru Anda (Rupiah). Angka saat ini hanya CONTOH. */
const R={visa:2000000,tiket:12000000,tiketInfant:1500000,transport:1200000,muthawwifPerHari:150000,
hotelMakkah:[300000,450000,700000],hotelMadinah:[250000,400000,600000]}; // per orang per malam
const v=i=>Math.max(0,+document.getElementById(i).value||0),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
function hitung(){const d=v('dw'),i=v('inf'),mk=v('mk'),md=v('md'),t=+tier.value,tr=+document.getElementById('tr').value,mt=+document.getElementById('mt').value,orang=d+i;
const rows=[['Visa ('+orang+' jamaah)',R.visa*orang],['Tiket pesawat',R.tiket*d+R.tiketInfant*i],['Hotel Makkah ('+mk+' malam)',R.hotelMakkah[t]*mk*d],['Hotel Madinah ('+md+' malam)',R.hotelMadinah[t]*md*d],['Transportasi lokal',R.transport*d*tr],['Pendamping muthawwif ('+(mk+md)+' hari)',R.muthawwifPerHari*(mk+md)*mt]];
const total=rows.reduce((s,r)=>s+r[1],0);
rinci.innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td style="text-align:right">${rp(r[1])}</td></tr>`).join('');
document.getElementById('tot').textContent=rp(total);pp.textContent='Sekitar '+rp(orang?total/orang:0)+' per jamaah';
bwa.href=wa(`saya sudah mencoba kalkulator: ${d} dewasa, ${i} infant, ${mk} malam Makkah, ${md} malam Madinah, estimasi total ${rp(total)}. Bisa dibahas?`)}
hitung();
</script></body></html>
